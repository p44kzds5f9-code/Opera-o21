<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>OPERAÇÃO 21 • CONCLUÍDA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070c0a;color:#f3efe4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;padding:28px 18px}.page{width:100%;max-width:720px;display:flex;align-items:center;min-height:calc(100vh - 56px)}

.status{padding:22px 20px;border:1px solid rgba(214,199,156,.2);border-radius:14px;background:rgba(169,158,120,.06)}
.row{margin:17px 0;font-size:17px;line-height:1.6;color:#ddd9ce}.label{display:block;font-size:10px;letter-spacing:2.5px;color:#a9a080;margin-bottom:5px}
.result{font-size:22px;color:#eee8d8;font-weight:500}.closing{text-align:center;margin-top:32px;font-size:17px;line-height:1.8;color:#ddd9ce}

</style>
</head>
<body><main class="page"><section class="card">

</div>

</section></main></body></html>
