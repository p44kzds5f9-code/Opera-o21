<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FASE 02 • CHECK-IN — Opera 021</title>
<style>
:root{--bg:#090909;--card:#111;--line:#292929;--text:#f4f1eb;--muted:#aaa;--accent:#d8b06a}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#1b1a18 0,#090909 48%,#050505 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{width:min(680px,92%);margin:auto;padding:52px 0 36px}.kicker{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:18px}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(38px,10vw,64px);line-height:.98;margin:0 0 22px} p{font-size:17px;line-height:1.65;color:#ddd}
.card{background:rgba(17,17,17,.88);border:1px solid var(--line);border-radius:18px;padding:26px;margin:28px 0}.label{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:10px}
.question{font-family:Georgia,serif;font-size:25px;line-height:1.3} textarea{width:100%;min-height:130px;margin-top:18px;background:#080808;color:var(--text);border:1px solid #3a3a3a;border-radius:12px;padding:15px;font-size:16px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent)} button{margin-top:16px;width:100%;border:1px solid var(--accent);background:transparent;color:var(--text);border-radius:12px;padding:15px;font-size:15px;letter-spacing:1px;cursor:pointer}
.message{min-height:24px;color:var(--muted);font-size:13px;margin-top:12px}.big{font-family:Georgia,serif;font-size:29px;line-height:1.3}.rule{border-top:1px solid var(--line);margin:28px 0}.quote{font-family:Georgia,serif;font-style:italic;font-size:22px;line-height:1.45;color:#eee}
footer{margin-top:45px;padding-top:18px;border-top:1px solid var(--line);font-size:10px;letter-spacing:2px;color:#777}
</style>
</head><body><main>
<div class="kicker">FASE 02 • CHECK-IN — OPERA 021</div><h1>Base<br>estabelecida.</h1>
<p>Chalé confirmado. Agora a missão muda de frequência.</p>
<div class="card"><div class="label">REGISTRO PESSOAL</div>
<div class="question">O que você mais gosta em nós dois depois de 21 anos?</div>
<textarea id="answer" placeholder="Escreva o que vier à cabeça..."></textarea>
<button id="send" type="button">ENVIAR →</button><div class="message" id="message">O sistema aguarda sua resposta.</div></div>
<footer>OPERA 021 • 21 anos • uma missão a dois</footer></main>
<script>
const answer=document.getElementById('answer'), button=document.getElementById('send'), message=document.getElementById('message');
button.addEventListener('click',function(){
 if(!answer.value.trim()){message.textContent='O sistema aguarda uma resposta.';answer.focus();return;}
 message.textContent='RESPOSTA REGISTRADA • acesso autorizado';
 setTimeout(function(){window.location.href='nfc02autorizado.html';},350);
});
</script></body></html>
